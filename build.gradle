plugins {
    id 'fabric-loom' version '1.13.6'
    id 'maven-publish'
}

// ---- 多版本支持：用 -Pmc=<minecraft 版本> 选择 versions/<版本>.properties ----
def mcTarget = findProperty('mc') ?: '1.21.1'
if (mcTarget != null) {
    def versionFile = file("versions/${mcTarget}.properties")
    if (!versionFile.exists()) {
        throw new GradleException("Unknown MC target '${mcTarget}': missing ${versionFile}")
    }
    def props = new Properties()
    versionFile.withInputStream { props.load(it) }
    props.each { key, value -> ext.set(key.toString(), value.toString()) }
    logger.lifecycle("[rollbackmod] Building for MC ${mcTarget}")
}

// ---- 版本专用源码目录（存在则加入，用于跨版本的少量差异代码）----
def versionedJava = file("src/versioned/${mcTarget}/java")
def versionedResources = file("src/versioned/${mcTarget}/resources")

version = project.mod_version
group = project.mod_group

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    mavenCentral()
}

loom {
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.java.srcDir versionedJava
sourceSets.main.resources.srcDir versionedResources

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${findProperty('cloth_version') ?: '15.0.140'}"
    modImplementation "com.terraformersmc:modmenu:11.0.5"
}

tasks.named('processResources', ProcessResources).configure {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

tasks.named('remapJar', net.fabricmc.loom.task.RemapJarTask).configure {
    // 产物名：模组名-模组版本-游戏版本-加载器
    archiveFileName = "${project.mod_id}-${project.mod_version}-${project.minecraft_version}-fabric.jar"
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.mod_id
            from components.java
        }
    }
    repositories {}
}
